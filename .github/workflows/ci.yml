name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: credence
          POSTGRES_PASSWORD: credence_password
          POSTGRES_DB: credence_mertonx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pyflakes psycopg2-binary
        
    - name: Lint with pyflakes
      run: |
        pyflakes api/ model/ workers/ data/
        
    - name: Test with pytest
      env:
        DATABASE_URL: postgresql://credence:credence_password@localhost:5432/credence_mertonx
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        pytest tests/
