version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: credence
      POSTGRES_PASSWORD: password
      POSTGRES_DB: credencedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://credence:password@postgres:5432/credencedb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://credence:password@postgres:5432/credencedb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  redisdata:
